
name: CloudSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CloudSentinel.slnx

      - name: Build
        run: dotnet build CloudSentinel.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CloudSentinel.Tests/CloudSentinel.Tests.csproj -c Release --no-build

      - name: Build Web image
        run: docker build -f Dockerfile.web -t cloudsentinel-web:ci .

      - name: Build Functions image
        run: docker build -f Dockerfile.functions -t cloudsentinel-functions:ci .
